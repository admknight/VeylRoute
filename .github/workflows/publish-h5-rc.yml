name: Publish Windows H5 unsigned prerelease

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-h5-rc.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.repository == 'admknight/VeylRoute'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '44507797802'
      SOURCE_SHA: 'c34df13aea2c208b2c543205bdc500a79c4e8509'
      TAG: 'v3.0.0-rc1-h5'
    steps:
      - name: Checkout release notes and pinned build commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful pinned Windows qualification and build
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
          outcome="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)"
          test "$actual_sha" = "$SOURCE_SHA"
          test "$outcome" = "success"
          test "$(git cat-file -t "$SOURCE_SHA")" = "commit"
          git show "$SOURCE_SHA:LICENSE" | grep -q 'MIT License'
          git show "$SOURCE_SHA:packaging/VeylRoute.iss" | grep -qF 'Source: "..\LICENSE"'
      - name: Retrieve and verify exact Windows build artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n VeylRoute-Windows-v3.0-RC1-H5-unsigned -D release-assets
          cd release-assets
          test -f VeylRoute-Windows-v3.0-RC1-H5-Portable.zip
          test -f VeylRoute-Windows-v3.0-RC1-H5-Setup.exe
          test -f SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          unzip -Z1 VeylRoute-Windows-v3.0-RC1-H5-Portable.zip | grep -q '/LICENSE$'
          unzip -Z1 VeylRoute-Windows-v3.0-RC1-H5-Portable.zip | grep -q '/VeylRoute.exe$'
      - name: Publish only an explicitly labelled unsigned prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Prerelease already exists; leaving unchanged.'
            exit 0
          fi
          gh release create "$TAG"             release-assets/VeylRoute-Windows-v3.0-RC1-H5-Portable.zip             release-assets/VeylRoute-Windows-v3.0-RC1-H5-Setup.exe             release-assets/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --target "$SOURCE_SHA"             --title 'VeylRoute Windows v3.0 RC1 H5 - unsigned prerelease'             --notes-file docs/RELEASE-H5.md             --prerelease
