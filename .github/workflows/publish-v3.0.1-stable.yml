name: Publish Windows v3.0.1 stable release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.0.1-stable.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.repository == 'admknight/VeylRoute'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '44568059908'
      SOURCE_SHA: 'cb487027cf34c2bb7761aa686bb042b8e1e20795'
      TAG: 'v3.0.1'
    steps:
      - name: Checkout stable release notes
        uses: actions/checkout@v4
      - name: Require successful pinned H6 Windows qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)" = "success"
          test -f docs/RELEASE-v3.0.1.md
      - name: Fetch the unchanged H6 packages and verify
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n VeylRoute-Windows-v3.0.1-H6-unsigned -D release-assets
          cd release-assets
          test -f VeylRoute-Windows-v3.0.1-Portable.zip
          test -f VeylRoute-Windows-v3.0.1-Setup.exe
          test -f SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          echo '3479a3e6e3e3b8f8fd8782a6b4d8b9ae4adcd7b2d94b73e497997f19d8e70134  VeylRoute-Windows-v3.0.1-Portable.zip' | sha256sum -c -
          echo '3dd8cc7f5e66cab23f22f4da73a79378374eeafc482e28d5bfbfaec7f6098e86  VeylRoute-Windows-v3.0.1-Setup.exe' | sha256sum -c -
          unzip -Z1 VeylRoute-Windows-v3.0.1-Portable.zip | grep -q '/LICENSE$'
          unzip -Z1 VeylRoute-Windows-v3.0.1-Portable.zip | grep -q '/VeylRoute.exe$'
          unzip -Z1 VeylRoute-Windows-v3.0.1-Portable.zip | grep -q '/install-context.json$'
          unzip -p VeylRoute-Windows-v3.0.1-Portable.zip '*/install-context.json' | grep -q '"installMode":"portable"'
      - name: Publish newest stable release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "false"
            echo 'Existing stable tag found: preserving published assets.'
            exit 0
          fi
          gh release create "$TAG" \
            release-assets/VeylRoute-Windows-v3.0.1-Portable.zip \
            release-assets/VeylRoute-Windows-v3.0.1-Setup.exe \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'VeylRoute Windows v3.0.1 - Stable (About & Smart Updates)' \
            --notes-file docs/RELEASE-v3.0.1.md \
            --latest
