name: Publish Linux 0.2.0 experimental packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-linux-v0.2.0.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.repository == 'admknight/VeylRoute'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '44593706249'
      SOURCE_SHA: '5b82665d65228354da132419913bbe8faa62b3e7'
      TAG: 'linux-v0.2.0-experimental'
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
      - name: Confirm pinned Linux CI success
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)" = "success"
          test -f docs/RELEASE-linux-v0.2.0.md
      - name: Download, verify and inspect exact experimental packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name VeylRoute-Linux-0.2.0-Experimental-unsigned -D release-assets
          cd release-assets
          test -f VeylRoute-Linux-0.2.0-Preview.deb
          test -f VeylRoute-Linux-0.2.0-Portable.tar.gz
          test -f SHA256SUMS-Linux.txt
          sha256sum --check SHA256SUMS-Linux.txt
          printf '%s\n' '97ed7b45b078dcaa67e173e7850043d9d81a0168e4bd8931df7243e59c7daffd  VeylRoute-Linux-0.2.0-Portable.tar.gz' | sha256sum --check -
          printf '%s\n' 'd224ff340edbcb6eda2ac019b7b051cbce8ab6a3aa58b645053411558a2fe2e2  VeylRoute-Linux-0.2.0-Preview.deb' | sha256sum --check -
          dpkg-deb --field VeylRoute-Linux-0.2.0-Preview.deb Version | grep -Fx '0.2.0'
          dpkg-deb --contents VeylRoute-Linux-0.2.0-Preview.deb > pkg-list.txt
          tar -tzf VeylRoute-Linux-0.2.0-Portable.tar.gz > tar-list.txt
          grep -F '/usr/share/applications/veylroute.desktop' pkg-list.txt
          grep -F '/usr/share/icons/hicolor/256x256/apps/veylroute.png' pkg-list.txt
          grep -F '/usr/lib/veylroute/veylroute/updates.py' pkg-list.txt
          grep -F '/veylroute/tray.py' tar-list.txt
          grep -F '/veylroute/desktop.py' tar-list.txt
          rm pkg-list.txt tar-list.txt
      - name: Publish only as experimental prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = 'true'
            echo 'Experimental release already exists; leaving unchanged'
            exit 0
          fi
          gh release create "$TAG" \
            release-assets/VeylRoute-Linux-0.2.0-Preview.deb \
            release-assets/VeylRoute-Linux-0.2.0-Portable.tar.gz \
            release-assets/SHA256SUMS-Linux.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'VeylRoute Linux v0.2.0 - desktop parity experimental preview' \
            --notes-file docs/RELEASE-linux-v0.2.0.md \
            --prerelease
